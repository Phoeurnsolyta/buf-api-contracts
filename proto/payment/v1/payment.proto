syntax = "proto3";

package payment.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "kh.edu.istad.contracts.payment.v1";

service PaymentService {
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);

  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);

  rpc UpdatePaymentStatus(UpdatePaymentStatusRequest) returns (UpdatePaymentStatusResponse);
}

message Payment {
  string payment_id = 1;
  string order_id = 2;
  string customer_id = 3;
  string amount = 4;
  PaymentStatus payment_status = 5;
  google.protobuf.Timestamp created_at = 6;
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_COMPLETED = 2;
  PAYMENT_STATUS_CANCELLED = 3;
  PAYMENT_STATUS_FAILED = 4;
}

message CreatePaymentRequest {
  string order_id = 1;
  string customer_id = 2;
  string amount = 3;
}

message CreatePaymentResponse {
  Payment payment = 1;
}

message GetPaymentRequest {
  string payment_id = 1;
}

message GetPaymentResponse {
  Payment payment = 1;
}

message UpdatePaymentStatusRequest {
  string payment_id = 1;
  PaymentStatus payment_status = 2;
}

message UpdatePaymentStatusResponse {
  Payment payment = 1;
}
